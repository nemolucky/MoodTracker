{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Mood Tracker{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    {% include "includes/navigation.html" %}

    <main class="container mb-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="py-3 text-center text-muted mt-auto">
        <div class="container">
            <small>&copy; <span id="current-year">2026</span> Mood Tracker — дневник эмоционального состояния</small>
        </div>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
